# Joint training (side adapter masks + concept classifier) with learnable
# language embeddings for the mask-classification layer. Masks are classified
# from the last PixelDiT block only (CONCEPT.LAYERS [4]); at its text input a
# learned delta (+ an ODISE-style per-image delta from the implicit captioner)
# is added to the text states the previous blocks computed from the default
# prompt. The side adapter's pass and blocks 1-3 keep the default prompt.
#   train: python train_net.py --config-file configs/san_pixeldit_concept_joint_prompt.yaml --num-gpus 1 OUTPUT_DIR output_joint_prompt
_BASE_: san_pixeldit_concept_joint.yaml
MODEL:
  CONCEPT:
    LAYERS: [4]
  PROMPT_LEARNER:
    ENABLED: True
    LAYER: -1          # = last of CONCEPT.LAYERS (block 4)
    SPAN: "all"
    LR_MULTIPLIER: 10.0
    IMPLICIT:
      ENABLED: True
      DIM: 512
      DEPTH: 2
      NUM_HEADS: 8
      POOL_SIZE: 16
