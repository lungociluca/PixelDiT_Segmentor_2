# Joint training on a 5-block PixelDiT, classifier supervised on GT segments.
#
# Mask prediction: the side adapter is fed PixelDiT blocks 1, 3, 5 and trained on
# its usual mask / objectness losses (Hungarian matching, as in "joint").
# Classification: concept attention from blocks 1-5 (LoRA on the text stream)
# + mask-embedding head on the image tokens of blocks 3-5, trained in the same
# step on the ground-truth segments (TRAIN_MODE "joint_gt"), not on the
# predicted masks. Blocks built = 5.
# Both paths see noisy PixelDiT inputs, x_t = 0.6 * image + 0.4 * noise.
#
# train:
#   python train_net.py --config-file configs/san_pixeldit_5blocks_joint_gt_135.yaml --num-gpus 1 OUTPUT_DIR output_5blocks_joint_gt_135
# eval (full pipeline): add --eval-only MODEL.WEIGHTS output_5blocks_joint_gt_135/model_final.pth
#   classifier alone:  ... MODEL.CONCEPT.GT_MASKS True
_BASE_: san_pixeldit_5blocks_joint_135.yaml
MODEL:
  SAN:
    # Inference: only queries with P(object) >= 0.5 vote in the semantic map
    # (the classifier is trained on GT segments, never on empty / junk masks).
    # Sweep at eval time: MODEL.SAN.QUERY_FILTER.OBJECTNESS_THRESHOLD / TOP_K.
    QUERY_FILTER:
      OBJECTNESS_THRESHOLD: 0.5
      TOP_K: 0
  PIXELDIT:
    FEATURE_LAYERS: [1, 3, 5]
    TIMESTEP: 0.4                  # mask path noise
    NOISE_SEED: 0
  SIDE_ADAPTER:
    FUSION_MAP: ["1->0", "3->1", "5->2"]
  CONCEPT:
    LAYERS: [1, 2, 3, 4, 5]
    TIMESTEP: 0.4                  # class path noise
    NOISE_SEED: 0
    GT_MASKS: False                # evaluate on the side adapter's masks
    LORA:
      TRAIN_MODE: "joint_gt"
      LOSS_WEIGHT: 2.0
    MASK_HEAD:
      ENABLED: True
      LAYERS: [3, 4, 5]
SOLVER:
  MAX_ITER: 10000                  # 3K left the classifier at ~25% train accuracy
