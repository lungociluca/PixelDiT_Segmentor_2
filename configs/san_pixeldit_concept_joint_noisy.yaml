# Joint run (san_pixeldit_concept_joint.yaml) with noisy PixelDiT inputs on both
# paths: masks and classes both see x_t = (1 - t) * image + t * noise at t = 0.4,
# with the same seed, so at inference they share one backbone pass.
#   train: python train_net.py --config-file configs/san_pixeldit_concept_joint_noisy.yaml --num-gpus 1 OUTPUT_DIR output_joint_noisy
#   eval:  add --eval-only MODEL.WEIGHTS output_joint_noisy/model_final.pth
# Sweep at eval time with MODEL.PIXELDIT.TIMESTEP / MODEL.CONCEPT.TIMESTEP.
#
# Mask path: the side adapter is fed PixelDiT blocks 3, 4, 5 ("k->j": block k is
# added to the side ViT tokens before side block j). Blocks built =
# max(FEATURE_LAYERS, CONCEPT.LAYERS) = 5; the class path keeps blocks 1-4.
_BASE_: san_pixeldit_concept_joint.yaml
MODEL:
  SIDE_ADAPTER:
    FUSION_MAP: ["3->0", "4->1", "5->2"]
  PIXELDIT:
    FEATURE_LAYERS: [3, 4, 5]
    TIMESTEP: 0.4                     # mask path (side adapter features)
    NOISE_SEED: 0
    NOISE_SIDE_ADAPTER_INPUT: False   # True: the side ViT's RGB input is noised too
  CONCEPT:
    TIMESTEP: 0.4                     # class path
    NOISE_SEED: 0
